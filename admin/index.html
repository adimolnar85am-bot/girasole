<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Girasole</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/admin.css?v=6" />
  </head>
  <body>
    <div id="login-screen" class="login-screen">
      <form id="login-form" class="login-card">
        <img class="login-logo" src="/assets/logo.png" alt="Girasole" />
        <p class="admin-kicker">Panou de administrare</p>
        <h1>Girasole</h1>
        <p>Gestionează conținutul site-ului, meniul și fotografiile.</p>
        <label>
          <span>Parolă</span>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary">Intră</button>
        <p class="form-msg" id="login-msg" role="status"></p>
      </form>
    </div>

    <div id="admin-app" class="admin-app" hidden>
      <header class="admin-header">
        <div class="admin-heading">
          <img class="admin-logo" src="/assets/logo.png" alt="" />
          <div>
            <p class="admin-kicker">Panou de administrare</p>
            <h1>Girasole</h1>
            <p>Conținut, imagini și informații pentru site.</p>
          </div>
        </div>
        <div class="admin-header-actions">
          <a class="btn btn-ghost" href="/" target="_blank" rel="noopener">Vezi site-ul</a>
          <button type="button" class="btn btn-primary" id="save-btn">Salvează modificările</button>
          <button type="button" class="btn btn-ghost" id="logout-btn">Deconectare</button>
        </div>
      </header>

      <p class="save-status" id="save-status" role="status"></p>

      <nav class="admin-nav" id="admin-nav"></nav>

      <main class="admin-main" id="admin-main"></main>
    </div>

    <div id="media-modal" class="media-modal" hidden>
      <div class="media-modal-backdrop" data-media-close></div>
      <div class="media-modal-panel" role="dialog" aria-modal="true" aria-labelledby="media-modal-title">
        <div class="media-modal-head">
          <h2 id="media-modal-title">Bibliotecă poze</h2>
          <button type="button" class="btn btn-ghost btn-small" data-media-close>Închide</button>
        </div>
        <p class="media-modal-hint">Imaginile din folderul <code>assets/</code> — click pentru a selecta.</p>
        <div class="media-grid" id="media-grid"></div>
      </div>
    </div>

    <script src="/admin/admin.js?v=10"></script>
  </body>
</html>
